services:
  # 1. Backend Web Service (Docker Container)
  - type: web
    runtime: docker
    name: field-service-backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: field-service-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://field-service-frontend.onrender.com","http://localhost:5173"]'
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false

  # 2. Frontend Static Site (React + Vite)
  - type: web
    runtime: static
    name: field-service-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: field-service-backend
          property: url

databases:
  # 3. Render Managed PostgreSQL Database
  - name: field-service-db
    databaseName: field_service_db
    user: field_ops
    plan: free
