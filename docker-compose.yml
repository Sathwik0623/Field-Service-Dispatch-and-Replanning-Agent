services:
  postgres:
    image: postgres:15-alpine
    container_name: field_service_db
    restart: always
    environment:
      POSTGRES_USER: field_ops
      POSTGRES_PASSWORD: field_ops_password
      POSTGRES_DB: field_service_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U field_ops -d field_service_db"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: field_service_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://field_ops:field_ops_password@postgres:5432/field_service_db
      APP_ENV: production
      DEBUG: "False"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80"]'
    ports:
      - "8000:8000"
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
